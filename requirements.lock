# Lockfile: jede Abhaengigkeit samt Unterabhaengigkeiten mit fester Fassung.
# Wird als pip-Constraint-Datei gelesen (`--constraint` in requirements.txt):
# sie legt Fassungen fest, installiert aber nichts, was requirements.txt
# nicht verlangt - tzdata etwa zieht Django nur unter Windows nach.
#
# Neu schreiben, wenn sich requirements.txt aendert: in einer frischen
# Umgebung `pip install -r requirements.txt`, Testsuite gruen, dann die
# Fassungen aus `pip freeze` hier eintragen.

