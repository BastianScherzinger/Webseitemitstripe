{% extends 'base.html' %}

{% block title %}Passwort geändert – Luviq-Shop{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="mb-3 fw-bold">Passwort erfolgreich geändert!</h3>
                    <p class="text-muted mb-4">
                        Dein neues Passwort wurde erfolgreich gespeichert. Du kannst dich jetzt mit deinem neuen Passwort anmelden.
                    </p>
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-5 fw-bold rounded-3">Jetzt anmelden</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
